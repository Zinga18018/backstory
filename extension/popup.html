<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backstory</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup-body">
  <header class="popup-header"><h1>Backstory</h1></header>
  <main>
    <p>Save the current GitHub link and selected text, then add your notes.</p>
    <button id="capture" class="button primary full">Capture page</button>
    <button id="open-workspace" class="button secondary full">Open cards</button>
    <p id="popup-status" class="status" role="status" aria-live="polite">Capture starts only when you click. Selected text is optional.</p>
  </main>
  <footer class="popup-footer">Local storage · Gemini off</footer>
</body>
</html>
