<text x="51" y="594" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#254f3d" text-anchor="start">Stored on this device</text>
<text x="51" y="621" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#53635a" text-anchor="start">No account. No sync.</text>
<text x="51" y="641" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#53635a" text-anchor="start">No AI calls.</text>
<text x="286" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#53635a" text-anchor="start">YOUR WORK, IN YOUR WORDS</text>
<text x="286" y="132" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#53635a" text-anchor="start">A small collection of decisions worth remembering.</text>
