<rect x="567" y="190" width="68" height="68" rx="18" fill="#254f3d"/>
<text x="601" y="241" font-family="Georgia, DejaVu Serif, serif" font-size="54" font-weight="400" fill="#ffffff" text-anchor="middle">b.</text>
<text x="601" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#53635a" text-anchor="middle">A RECORD OF THE REAL WORK</text>
<text x="601" y="341" font-family="Georgia, DejaVu Serif, serif" font-size="41" font-weight="400" fill="#213a31" text-anchor="middle">Good work deserves</text>
<text x="601" y="386" font-family="Georgia, DejaVu Serif, serif" font-size="41" font-weight="400" fill="#213a31" text-anchor="middle">a backstory.</text>
<text x="601" y="423" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#53635a" text-anchor="middle">The tricky bug. The trade-off. The part you owned.</text>
<text x="601" y="448" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#53635a" text-anchor="middle">Turn the details you’ll forget into stories you can explain.</text>
<rect x="490" y="475" width="223" height="42" rx="7" fill="#254f3d"/>
<text x="601.5" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Write my first card  ↗</text>
<text x="289" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#53635a" text-anchor="start">01 / CAPTURE</text>
<text x="289" y="587" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#213a31" text-anchor="start">Keep a starting point</text>
<text x="289" y="613" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#53635a" text-anchor="start">A link and selected code.</text>
<text x="512" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#53635a" text-anchor="start">02 / REFLECT</text>
<text x="512" y="587" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#213a31" text-anchor="start">Add what only you know</text>
<text x="512" y="613" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#53635a" text-anchor="start">The decisions behind it.</text>
<text x="748" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#53635a" text-anchor="start">03 / PRACTICE</text>
<text x="748" y="587" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#213a31" text-anchor="start">Tell it with evidence</text>
<text x="748" y="613" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#53635a" text-anchor="start">Prompts, not a verdict.</text>
<text x="34" y="703" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#53635a" text-anchor="start">A source-informed illustration of the empty workspace. Layout simplified for this overview.</text>
<text x="34" y="733" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#53635a" text-anchor="start">No saved cards, private code, or user records. Real-browser extension QA is still separate.</text>
</svg>
